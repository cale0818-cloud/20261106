<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f2"><title>日序 Daymark｜個人行程與任務管理</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="開啟工作區導覽" aria-expanded="false"><span></span><span></span><span></span></button><button class="mobile-nav-scrim" id="mobileNavScrim" aria-label="關閉導覽"></button><div class="app-shell"><aside class="sidebar"><a class="brand" href="#"><span class="brand-mark">d.</span><span>日序 <small>DAYMARK</small></span></a><button class="profile-switch"><span class="avatar">林</span><span class="profile-copy"><b>林予安</b><small>個人工作區</small></span><span class="chevron">⌄</span></button><button class="new-button" id="newTask"><span>＋</span> 新增任務 <kbd>N</kbd></button><div class="nav-label">工作區</div><nav class="main-nav"><button class="nav-item active" data-page="today"><span class="nav-icon">◷</span> 今日總覽 <span class="nav-count" id="todayCount">0</span></button><button class="nav-item" data-page="calendar"><span class="nav-icon">▦</span> 行事曆</button><button class="nav-item" data-page="tasks"><span class="nav-icon">☑</span> 所有任務</button></nav><div class="nav-label spaced">個人成長</div><nav class="main-nav"><button class="nav-item" data-page="habits"><span class="nav-icon">↗</span> 習慣追蹤</button><button class="nav-item" data-page="goals"><span class="nav-icon">◎</span> 長期目標</button></nav><div class="sidebar-bottom"><div class="focus-card"><div class="focus-top"><span>✦ 今日專注</span><span>第 12 天</span></div><strong>做得剛剛好，<br>就很不錯了。</strong><div class="focus-progress"><i></i></div><small>本週完成 8 / 12 項</small></div><button class="nav-item settings-link" id="settingsBtn"><span class="nav-icon">⚙</span> 提醒與設定 <span class="settings-dot"></span></button><div class="sidebar-foot">© 2025 日序 Daymark</div></div></aside><main class="main-area"><header class="topbar"><div class="breadcrumb"><span>個人工作區</span><span class="crumb-sep">/</span><b id="pageCrumb">今日總覽</b></div><div class="top-actions"><span class="sync-status"><i></i> 已同步</span><button class="icon-button" id="notifyBtn" aria-label="通知">♧<i class="notify-dot"></i></button><button class="icon-button help-btn">?</button><span class="top-avatar">林</span></div></header><section class="page-content" id="pageContent"></section></main></div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div><div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">加到你的日序</div><h2>建立新任務</h2></div><button class="icon-button close-modal">×</button></div><form id="taskForm"><label class="field-label">任務名稱<input id="taskTitle" required maxlength="80" placeholder="例如：整理提案簡報"></label><div class="form-row"><label class="field-label">日期<input id="taskDate" type="date" required></label><label class="field-label">截止時間<input id="taskTime" type="time"></label></div><div class="form-row"><label class="field-label">分類<select id="taskCategory"><option>工作</option><option>生活</option><option>學習</option><option>健康</option></select></label><label class="field-label">優先級<select id="taskPriority"><option value="medium">一般</option><option value="high">重要</option><option value="low">較低</option></select></label></div><div class="modal-actions"><button type="button" class="secondary-btn close-modal">取消</button><button type="submit" class="primary-btn">建立任務 <span>→</span></button></div></form></section></div>
<div class="modal-backdrop" id="settingsBackdrop" aria-hidden="true"><section class="modal settings-modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">個人化你的日序</div><h2>提醒與設定</h2></div><button class="icon-button close-settings">×</button></div><div class="settings-section"><h3>提醒方式</h3><label class="setting-row"><span><b>瀏覽器通知</b><small>在手機或電腦瀏覽器接收提醒</small></span><button class="toggle" id="browserToggle" role="switch" aria-checked="false"><i></i></button></label><label class="setting-row"><span><b>電子郵件提醒</b><small>重要行程與截止日前寄送摘要</small></span><button class="toggle on" role="switch" aria-checked="true"><i></i></button></label><label class="setting-row"><span><b>每日習慣提醒</b><small>尚未完成的習慣於晚間提醒</small></span><button class="toggle on" role="switch" aria-checked="true"><i></i></button></label></div><div class="settings-section"><h3>提醒時機</h3><div class="reminder-chips"><button class="chip selected">行程開始前 10 分鐘</button><button class="chip selected">任務截止前 1 天</button><button class="chip selected">里程碑到期前 3 天</button></div><p class="settings-note">提醒會同步套用於已登入的裝置。瀏覽器通知需先授權；郵件功能為原型示意。</p></div><div class="modal-actions"><button class="primary-btn close-settings">完成設定 <span>→</span></button></div></section></div><script src="app.js"></script></body></html>
